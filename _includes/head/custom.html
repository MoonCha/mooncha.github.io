{% if page.collection == "posts" or page.math %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    },
    startup: {
      typeset: false
    }
  };

  function normalizeLegacyMathDelimiters(root) {
    if (!root) {
      return;
    }

    for (const element of root.querySelectorAll("p, li, blockquote")) {
      if (element.children.length > 0) {
        continue;
      }

      const text = element.textContent.trim();
      const match = text.match(/^\$\$([\s\S]+)\$\$$/);
      if (match) {
        element.textContent = "\\[" + match[1].trim() + "\\]";
      }
    }

    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.includes("$$")) {
            return NodeFilter.FILTER_REJECT;
          }

          let element = node.parentElement;
          while (element) {
            if (["CODE", "PRE", "SCRIPT", "STYLE", "TEXTAREA"].includes(element.tagName)) {
              return NodeFilter.FILTER_REJECT;
            }
            element = element.parentElement;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes = [];
    while (walker.nextNode()) {
      nodes.push(walker.currentNode);
    }

    for (const node of nodes) {
      node.nodeValue = node.nodeValue.replace(/\$\$([\s\S]+?)\$\$/g, "\\($1\\)");
    }
  }

  window.addEventListener("load", function() {
    const root = document.querySelector(".page__content");
    normalizeLegacyMathDelimiters(root);

    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise(root ? [root] : undefined);
    }
  });
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
